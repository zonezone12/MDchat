[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "md-analysis"
version = "1.0.0"
description = "MDChat — LLM-powered Molecular Dynamics trajectory analysis platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "MDAnalysis>=2.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "Pillow>=9.0.0",
    "imageio>=2.9.0",
]

[project.optional-dependencies]
chat = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]
viz = [
    "datashader>=0.14.0",
    "plotly>=5.0.0",
    "scikit-image>=0.19.0",
]
rdkit = [
    "rdkit>=2022.03",
]
all = [
    "md-analysis[chat,viz,rdkit]",
]

[project.scripts]
mdchat = "src.mdchat.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]
